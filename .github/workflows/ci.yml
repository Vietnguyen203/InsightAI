name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @insightai/contracts build
      - run: pnpm format:check
      - run: pnpm --filter @insightai/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (PostgreSQL, Redis, S3)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insightai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d insightai"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/insightai
      DATABASE_MIGRATE_URL: postgresql://insightai_owner:owner_ci_pw@localhost:5432/insightai?schema=app
      DATABASE_URL: postgresql://insightai_app:app_ci_pw@localhost:5432/insightai
      DATABASE_PROVISIONER_URL: postgresql://insightai_provisioner:provisioner_ci_pw@localhost:5432/insightai
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      DATABASE_ANALYTICS_URL: postgresql://insightai_analytics:analytics_ci_pw@localhost:5432/insightai
      DATABASE_INGEST_URL: postgresql://insightai_ingest:ingest_ci_pw@localhost:5432/insightai
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: insightai-ci
      S3_ACCESS_KEY_ID: insightai-dev
      S3_SECRET_ACCESS_KEY: insightai-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Service containers cannot pass a command, so the S3-compatible store is started manually.
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @insightai/contracts build
      # Prisma 7: `migrate deploy` no longer generates the client; tests import it.
      - run: pnpm --filter @insightai/api prisma:generate
      - run: pnpm db:bootstrap
      - run: pnpm storage:bootstrap
      - run: pnpm db:migrate
      - run: pnpm test:int
      # Eval sets in oracle mode (no API key): fixtures, deterministic pipeline, guards, scoring.
      - name: AI eval (oracle)
        run: pnpm --filter @insightai/api exec vitest run --project integration test/ai-eval.int.test.ts test/investigation-eval.int.test.ts
        env:
          AI_EVAL: oracle

  e2e:
    name: End-to-end (Playwright, fake OpenAI)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insightai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d insightai"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/insightai
      DATABASE_MIGRATE_URL: postgresql://insightai_owner:owner_ci_pw@localhost:5432/insightai?schema=app
      DATABASE_URL: postgresql://insightai_app:app_ci_pw@localhost:5432/insightai
      DATABASE_PROVISIONER_URL: postgresql://insightai_provisioner:provisioner_ci_pw@localhost:5432/insightai
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      DATABASE_ANALYTICS_URL: postgresql://insightai_analytics:analytics_ci_pw@localhost:5432/insightai
      DATABASE_INGEST_URL: postgresql://insightai_ingest:ingest_ci_pw@localhost:5432/insightai
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: insightai-ci
      S3_ACCESS_KEY_ID: insightai-dev
      S3_SECRET_ACCESS_KEY: insightai-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Service containers cannot pass a command, so the S3-compatible store is started manually.
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @insightai/contracts build
      - run: pnpm --filter @insightai/api prisma:generate
      - run: pnpm --filter @insightai/api build
      - run: pnpm db:bootstrap
      - run: pnpm storage:bootstrap
      - run: pnpm db:migrate
      # The browser is cached per lockfile and saved right after download, even if the job fails.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Browser download and apt on the runner fail or hang now and then: they run as separate
      # steps (to see which one hangs) and each attempt is capped at 4 min, then retried.
      - name: Download Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 240 pnpm exec playwright install chromium && exit 0
            echo "Chromium download failed or timed out (attempt $attempt), retrying in 20 s"
            sleep 20
          done
          exit 1
      - name: Save Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
      # ubuntu-latest already ships Chromium's libraries; when the runner's apt mirror is
      # unreachable only optional fonts are missing, so this step must not fail the job.
      # A real missing library would still fail `pnpm test:e2e` with a clear launch error.
      - name: Install Chromium system dependencies
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            timeout -k 10 240 pnpm exec playwright install-deps chromium && exit 0
            echo "Chromium dependencies install failed or timed out (attempt $attempt), retrying in 20 s"
            sleep 20
          done
          exit 1
      - run: pnpm test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            test-results/e2e
          retention-days: 7

  images:
    name: Docker images (api, migrate, web, backup)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API runtime
        run: docker buildx build --load -f apps/api/Dockerfile -t insightai-api:ci .
      - name: Build migrate job
        run: docker buildx build -f apps/api/Dockerfile --target migrate -t insightai-migrate:ci .
      - name: Build web edge
        run: docker buildx build --load -f apps/web/Dockerfile -t insightai-web:ci .
      - name: Build backup toolbox
        run: docker buildx build docker/backup -t insightai-backup:ci
      - name: Images contain no secrets and run as non-root
        run: |
          docker run --rm --entrypoint sh insightai-api:ci -c 'test ! -e /app/.env && test "$(id -u)" != 0'
          docker run --rm --entrypoint sh insightai-web:ci -c 'test -f /srv/index.html && test -f /etc/caddy/Caddyfile'
      - name: Compose file is valid
        env:
          # Relative to docker/ (the compose file's directory).
          INSIGHTAI_ENV_FILE: production.env.example
          POSTGRES_SUPERUSER_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: docker compose -f docker/compose.prod.yml --profile selfhosted-db --profile backup config -q
